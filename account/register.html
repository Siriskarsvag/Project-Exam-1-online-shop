<!doctype html>
<html lang="en">
  <head>
    <title>The Collection - Register Page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Register page for The Collection" />
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/toast.js" defer></script>
    <script src="../js/register.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="../index.html" aria-label="Return to homepage"
        ><img src="../assets/image0.png" alt="The Collection Logo" class="logo"
      /></a>
      <div class="brand-lines">
        <div class="thin-line"></div>
        <div class="thicker-line"></div>
      </div>
      <h1>The Collection</h1>
      <nav>
        <a href="login.html" aria-label="Go to Login page">
          <img src="../assets/login_19006828.png" alt="Login Icon"
        /></a>
        <a href="../cart/index.html" aria-label="Go to shopping cart">
          <img src="../assets/shopping-cart_3916598.png" alt="Cart Icon"
        /></a>
      </nav>
    </header>
    <main>
      <section class="register-section">
        <h2>Register</h2>
        <form id="register-form">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            required
          />
          <button type="submit" class="CTA">Register</button>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2024 The Collection. All rights reserved.</p>
      <div class="brand-lines">
        <div class="thin-line"></div>
        <div class="thicker-line"></div>
      </div>
    </footer>
    <div id="toast-container"></div>
  </body>
</html>
